name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build and runtime dependencies
        # nasm builds libjpeg-turbo's SIMD kernels for mozjpeg; tmux and
        # fontconfig are what ttycast drives at runtime, and the tests use them.
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm tmux fontconfig fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
