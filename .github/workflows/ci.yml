name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build and runtime dependencies
        # nasm builds libjpeg-turbo's SIMD kernels for mozjpeg; tmux and
        # fontconfig are what ttycast drives at runtime, and the tests use them.
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm tmux fontconfig fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nasm
      # Only the shipped binary; dev-dependencies may need a newer toolchain.
      - run: cargo check --locked

  # Tags every tested commit on main with the next patch version (vX.Y.Z).
  version:
    name: Version tag
    needs: [test, msrv]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}
