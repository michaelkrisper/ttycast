[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttycast"
version = "0.1.0"
description = "Cast your terminal to a TV - Miracast, Chromecast or plain browser, straight from the shell."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michael Krisper", email = "michael.krisper@gmail.com" }]
requires-python = ">=3.10"
keywords = ["terminal", "tmux", "miracast", "chromecast", "screencast", "tv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = ["pillow>=9.0"]

[project.optional-dependencies]
chromecast = ["PyChromecast>=13"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/michaelkrisper/ttycast"
Issues = "https://github.com/michaelkrisper/ttycast/issues"

[project.scripts]
ttycast = "ttycast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ttycast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
